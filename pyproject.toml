[project]
name = "ashtalakshmi-mrv"
version = "0.1.0"
description = "Ashtalakshmi MRV platform for forest monitoring and carbon assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
    "numpy",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "jinja2",
]

[project.optional-dependencies]
# Full geospatial stack (install when ready for production)
geo = [
    "geoalchemy2",
    "asyncpg",
    "rasterio",
    "xarray",
    "rioxarray",
    "odc-stac",
    "shapely>=2.0",
    "geopandas",
    "lightgbm",
    "scikit-learn",
    "rasterstats",
    "pystac-client",
    "celery[redis]",
    "redis",
    "boto3",
    "weasyprint",
    "Pillow",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
