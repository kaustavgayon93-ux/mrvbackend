<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Report{% endblock %}</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-family: Georgia, serif;
                font-size: 9pt;
                color: #555;
            }
            @bottom-left {
                content: "{{ generated_at }} | Hash: {{ report_hash[:8] }}";
                font-family: monospace;
                font-size: 9pt;
                color: #555;
            }
        }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        h1, h2, h3, h4 {
            color: #166534;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #166534;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0;
            font-size: 24pt;
        }
        .header p {
            margin: 5px 0 0 0;
            color: #666;
            font-style: italic;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 10pt;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
            font-weight: bold;
            color: #166534;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        .summary-box {
            background-color: #f0fdf4;
            border: 1px solid #166534;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .page-break {
            page-break-before: always;
        }
        .footer-note {
            font-size: 8pt;
            color: #777;
            text-align: center;
            margin-top: 50px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="header">
        <h1>Ashtalakshmi MRV Platform</h1>
        <p>{% block header %}Verification Report{% endblock %}</p>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer-note">
        <p>Generated by Ashtalakshmi MRV Automated Verification System.</p>
        <p>This document contains cryptographically verifiable assessment data.</p>
    </div>
</body>
</html>
